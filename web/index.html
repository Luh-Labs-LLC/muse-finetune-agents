<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muse Spark Fine-Tune Agents</title>
<meta name="description" content="Plain English in, a judged fine-tune out: Muse Spark agents design fine-tuning jobs and judge the results.">
<meta name="color-scheme" content="light dark">
<script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315171c'/%3E%3Cg transform='translate(4 4)'%3E%3Cpath fill='%23ffffff' d='M5 4h14a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5L8 21v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z'/%3E%3Cpath d='M8.2 10.6l2.6 2.6 5-5.4' fill='none' stroke='%2315171c' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script>
  // Before the app's code has even arrived: start fetching the results page's data (the list of runs, then the run the
  // address asks for, or the best one), so by the time React renders, the numbers are already on their way or here.
  // src/lib/data.js picks these up (window.__early) instead of fetching again.
  (function () {
    try {
      var q = new URLSearchParams(location.search), site = q.get("site") || (location.hostname.indexOf("results.") === 0 ? "results" : "meta");
      if (q.get("request")) return;
      var early = window.__early = {};
      var runs = early["/results/runs.json"] = fetch("/results/runs.json", { cache: "no-cache" });
      if (site !== "results") return;
      runs.then(function (r) { return r.clone().json(); }).then(function (list) {
        var asked = q.get("run"), pick = null;
        for (var i = 0; i < list.length; i++) if (list[i].job === asked) pick = list[i];
        pick = pick || list[0];
        if (pick) early["/results/" + pick.job + ".json"] = fetch("/results/" + pick.job + ".json", { cache: "no-cache" });
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
